<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  
</head>
<body>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-4">
        <div class="input-group mb-3">
          <input type="text" class="form-control" id="display" disabled>
        </div>
        <div class="row">
          <div class="col">
            <br>
            <button class="btn btn-secondary" onclick="clearDisplay()">C</button><br>
            <br>
            <button class="btn btn-secondary" onclick="addOperator('^2')">x²</button><br>
            <br>
            <button class="btn btn-secondary" onclick="addOperator('%')">%</button><br>
            <br>
            <button class="btn btn-secondary" onclick="addOperator('/')">/</button><br>
            <br>
          </div>
          
          <div class="col">
            <br>
            <button class="btn btn-secondary" onclick="addNumber(7)">7</button><br><br>
            <button class="btn btn-secondary" onclick="addNumber(8)">8</button><br><br>
            <button class="btn btn-secondary" onclick="addNumber(9)">9</button><br><br>
            <button class="btn btn-secondary" onclick="addOperator('*')">*</button><br><br>
          </div>
          <div class="col"><br>
            <button class="btn btn-secondary" onclick="addNumber(4)">4</button><br><br>
            <button class="btn btn-secondary" onclick="addNumber(5)">5</button><br><br>
            <button class="btn btn-secondary" onclick="addNumber(6)">6</button><br><br>
            <button class="btn btn-secondary" onclick="addOperator('-')">-</button><br><br>
          </div>
          <div class="col"><br>
            <button class="btn btn-secondary" onclick="addNumber(1)">1</button><br><br>
            <button class="btn btn-secondary" onclick="addNumber(2)">2</button><br><br>
            <button class="btn btn-secondary" onclick="addNumber(3)">3</button><br><br>
            <button class="btn btn-secondary" onclick="addOperator('+')">+</button><br><br>
          </div>
          <div class="col-3"><br>
            <button class="btn btn-secondary" onclick="calculateResult()">=</button><br><br><br><br>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const display = document.getElementById('display');

    function addNumber(num) {
      display.value += num;
    }

    function addOperator(operator) {
      display.value += operator;
    }

    function clearDisplay() {
      display.value = '';
    }

    function calculateResult() {
      try {
        // Replace x² with Math.pow to handle squaring
        const expression = display.value.replace(/x²/g, '**2').replace(/x/g, '*');
        display.value = eval(expression);
      } catch (error) {
        display.value = 'Error';
      }
    }
  </script>
</body>
</html>
