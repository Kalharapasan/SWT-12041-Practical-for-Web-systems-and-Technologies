<body>
    <script>

        //DOM-DOcument Object Model
        //Operation action <button>
        
            function haiMessage(){
                alert('Hai');
            }
            function haiMessage2(){
                document.write('Hai');
            }

            function haiMessageColore(){
                document.bgColor="red"
            }

            function colorChange(){
                document.bgColor="blue"
            
            }
    </script>
    <input type="button" value="Click" onclick="haiMessage()"><br><br><br>
    <input type="button" value="Click" onclick="haiMessage2()"><br><br><br>

    <input type="button" value="Click" onclick="haiMessageColore()"" onmouseout="colorChange()"><br><br><br>
