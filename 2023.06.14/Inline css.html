<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Inline Css</title>
</head>
<body style="background-color: beige;">

    <!-- Inline css-->
    
	<h1 style="color:red;font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;">Hello</h1>
    <h2 style="color:blue;font-weight: bold;">Hello</h2>
    <h3 style="color:purple;background-color: aqua;">Hello</h3>
    <h4 style="color:black;font-family: Verdana, Geneva, Tahoma, sans-serif;">Hello</h4>
    <h2 style="color:brown;text-align:center;">Hello</h2>
    <h6 style="color:orange;text-shadow: 20px 8px 2px;font-size: 50px;">Hello</h6>
    
    <br>
    <br>

    <h3 style="margin-top: 10px ;margin-bottom: 100px;margin-left: 20px;margin-right: 20px;">Hello World</h3>

    <br>

    <h6 style="padding-left: 50px;padding-top: 56px;padding-bottom: 66px;padding-right: 56;">HELLO KALHARA</h6>

    <br>
    


    <h3 style="background-color: green;color: white;margin: 50px;">Hello World</h3>

    <h3 style="background-color: red;color: white;margin-left: 100px;">Hello World</h3>

    <h3 style="background-color: blue;color: white;margin-right: 100px;">Hello World</h3>

    <h3 style="background-color: brown;color: white;margin-top: 100px;">Hello World</h3>

    <h3 style="background-color: green;color: white;margin-bottom: 100px;">Hello World</h3>

    <h3 style="background-color: violet;color: white;margin-top: 20px ;margin-bottom:30px;margin-left: 40px;margin-right: 15px">Hello World</h3>

    <h3 style="background-color: peru;color: white;margin: 20px 30px 40px 15px;">Hello World</h3>

    <h3 style="background-color:palevioletred;border-radius: 20px;color: white;margin: 20px 30px 40px 15px;">Hello World</h3>

    <h3 style="background-color:aqua;border-radius: 20px;color: white;margin: 20px 30px 40px 15px;padding: 5px 550px 5px 550px;">Hello World</h3>

    <h3 style="width: 50px;height: 50px;;background-color: aqua;border-radius: 50%;padding: 30px 30px;">HELLO</h3>
</body>
</html>
