<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css">
    <title>Register</title>
</head>
<body class="p-3 mb-2 bg-light text-dark">

    <!-- Top Navbar  -->
    <nav class="navbar navbar-expand-lg" style="background-color: #2061ec;">
        <div class="container-fluid">
            <a class="navbar-brand text-white" href="#">
                <img src="images.jpeg" alt="Bootstrap" width="30" height="24">
            </a>
            <a class="navbar-brand text-white" href="#">South Eastern University of Sri Lanka</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="btn btn-outline-light" href="#">Home</a>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <a href="Ex04.html" class="btn btn-success">Login</a>
                </form>
            </div>
        </div>
    </nav>

    <!-- Centered Registration Form -->
    <div class="container min-vh-100 d-flex justify-content-center align-items-center">
        <div class="col-md-6">
            <div class="p-4 bg-white rounded-3 shadow-lg">
                <h3 class="text-center mb-4 text-primary">Register</h3>
                <form class="form-control-lg row g-3">
                    <div class="row">
                        <div class="col">
                            <input type="text" class="form-control" placeholder="First name" aria-label="First name" required>
                        </div>
                        <div class="col">
                            <input type="text" class="form-control" placeholder="Last name" aria-label="Last name" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col">
                            <input type="email" class="form-control" placeholder="Email" aria-label="Email" required>
                        </div>
                        <div class="col">
                            <input type="password" class="form-control" placeholder="Password" aria-label="Password" required>
                        </div>
                    </div>

                    <div class="row justify-content-center">
                        <div class="col-sm-5">
                            <button type="submit" class="btn btn-primary w-100 shadow-sm">Register</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-5 text-center text-white" style="background-color: #2061ec; padding: 10px;">
        <p>© 2024 South Eastern University of Sri Lanka</p>
    </footer>

</body>
</html>
