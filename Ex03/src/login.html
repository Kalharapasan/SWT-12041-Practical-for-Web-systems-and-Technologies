<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="./output.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded shadow-md w-full max-w-sm">
        <h2 class="text-2xl font-bold text-center mb-6">Login</h2>
        <form action="#">
            <div class="mb-4">
                <label for="email" class="block text-gray-700 mb-2">Email</label>
                <input type="email" id="email" class="w-full p-3 border border-gray-300 rounded" placeholder="Enter your email">
            </div>
            <div class="mb-6">
                <label for="password" class="block text-gray-700 mb-2">Password</label>
                <input type="password" id="password" class="w-full p-3 border border-gray-300 rounded" placeholder="Enter your password">
            </div>
            <button type="submit" class="w-full bg-blue-500 text-white p-3 rounded">Login</button>
        </form>
        <p class="mt-4 text-center">Don't have an account? <a href="#" class="text-blue-500">Sign up</a></p>
    </div>
</body>
</html>
